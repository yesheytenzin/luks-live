# Insert the Luks Live gate immediately before the active encryption hook.
_omaliveboot_hooks=()
_omaliveboot_added=0
for _omaliveboot_hook in "${HOOKS[@]}"; do
  if [[ $_omaliveboot_added == 0 && ( $_omaliveboot_hook == encrypt || $_omaliveboot_hook == sd-encrypt ) ]]; then
    _omaliveboot_hooks+=(luks-live)
    _omaliveboot_added=1
  fi
  _omaliveboot_hooks+=("$_omaliveboot_hook")
done
HOOKS=("${_omaliveboot_hooks[@]}")
unset _omaliveboot_hooks _omaliveboot_added _omaliveboot_hook
