# Insert the Luks Live gate immediately after Plymouth so the
# wall-clock video timer and the initramfs sleep share the same
# start time. Falling back to before encrypt if no Plymouth hook
# is present keeps non-Plymouth setups working.
_omaliveboot_hooks=()
_omaliveboot_added=0
for _omaliveboot_hook in "${HOOKS[@]}"; do
  _omaliveboot_hooks+=("$_omaliveboot_hook")
  if [[ $_omaliveboot_added == 0 && $_omaliveboot_hook == plymouth ]]; then
    _omaliveboot_hooks+=(luks-live)
    _omaliveboot_added=1
  fi
done
if (( _omaliveboot_added == 0 )); then
  _omaliveboot_tmp=()
  for _omaliveboot_hook in "${_omaliveboot_hooks[@]}"; do
    if [[ $_omaliveboot_added == 0 && ( $_omaliveboot_hook == encrypt || $_omaliveboot_hook == sd-encrypt ) ]]; then
      _omaliveboot_tmp+=(luks-live)
      _omaliveboot_added=1
    fi
    _omaliveboot_tmp+=("$_omaliveboot_hook")
  done
  HOOKS=("${_omaliveboot_tmp[@]}")
  unset _omaliveboot_tmp
  if (( _omaliveboot_added == 0 )); then
    HOOKS+=(luks-live)
  fi
fi
unset _omaliveboot_hooks _omaliveboot_added _omaliveboot_hook
